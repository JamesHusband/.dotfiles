# === Core ===
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g extended-keys on     # Ghostty CSI-u keyboard protocol

# === Prefix ===
unbind C-b
set -g prefix C-Space
set -g prefix2 C-@          # fallback: some terminals send Ctrl+Space as NUL (C-@)
bind C-Space send-prefix
bind C-@ send-prefix

# === Bindings ===
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind c new-window -c "#{pane_current_path}"

# === Floating popups ===
bind p display-popup -E -w 80% -h 80% -x C -y C
bind g display-popup -E -w 90% -h 90% -x C -y C "lazygit"

# === Copy mode ===
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# === Status bar ===
set -g status 2
set -g status-position bottom
set -g status-format[0] "#[fill=#282c34]"
set -g status-format[1] "#{W:#{E:window-status-format},#{E:window-status-current-format}}#[align=right]#{E:status-right}"
set -g status-style "bg=#1e2127,fg=#545b66"
set -g status-left ""
set -g status-right '#{?client_prefix,#[fg=red bold][PREFIX]#[default] ,}'
set -g window-status-format "#[bg=#1e2127,fg=#545b66] #W "
set -g window-status-current-format "#[bg=#1e2127,fg=white bold] ▸ #W "
set -g window-status-separator ""

# === Pane borders ===
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#ff6f00 bold],#[fg=#545b66]} #{pane_title} "
set -g pane-border-style "fg=#3a4148"
set -g pane-active-border-style "fg=#ff6f00"

# === Messages ===
set -g message-style "bg=#1f2428,fg=#c8d1dc"

# === Plugins ===
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Nucc/tmux-which-key'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

set -g @which-key-config '~/.config/tmux/which-key.json'
set -g @which-key-popup-bg '#1e2127'
set -g @which-key-popup-fg '#545b66'

run '~/.config/tmux/plugins/tpm/tpm'
